# OPT-IN TEMPLATE — copy to .github/workflows/deploy-living-lab-pages.yml only after
# GitHub Pages > Build and deployment > Source has been changed to "GitHub Actions".
name: Annapurna signals + Pages deployment

on:
  push:
    branches: [main]
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: living-lab-pages
  cancel-in-progress: false

jobs:
  build-test-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install contract validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Refresh public repository telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_repository_signals.py
      - name: Append semantic history only on factual change
        run: python scripts/update_public_history.py
      - name: Refresh shared temporal presentation state
        run: python scripts/generate_temporal_state.py
      - name: Synchronize local-preview public data
        run: python scripts/generate_public_data.py
      - name: Validate v3.8 truth, adaptive, sensory, immersive and living-world contracts
        run: |
          python scripts/validate_json_schemas.py
          python scripts/interaction_contract_test.py
          python scripts/adaptive_contract_test.py
          python scripts/temporal_sensory_contract_test.py
          python scripts/perceived_liveness_contract_test.py
          python scripts/immersive_experience_contract_test.py
          python scripts/immersive_coherence_contract_test.py
          python scripts/v20_living_world_contract_test.py
          python scripts/v21_living_world_contract_test.py
          python scripts/v22_living_world_contract_test.py
          python scripts/v23_micro_scene_contract_test.py
          python scripts/v24_cross_world_contract_test.py
          python scripts/v24_ephemerality_test.py
          python scripts/v25_composite_scene_contract_test.py
          python scripts/v25_ephemerality_test.py
          python scripts/v30_experience_reconstruction_test.py
          python scripts/v31_visual_stability_test.py
          python scripts/v32_material_living_test.py
          python scripts/v33_motion_grammar_test.py
          python scripts/v34_journey_frame_test.py
          python scripts/v35_spatial_coherence_test.py
          python scripts/v36_typography_rhythm_test.py
          python scripts/v38_optical_material_test.py
          python scripts/v38_public_data_test.py
          python scripts/public_copy_audit.py
          python scripts/first_30s_market_test.py
          python scripts/comprehension_audit.py
          python scripts/v38_release_audit.py

      - name: Lighthouse market-site gate
        run: |
          python -m http.server 8000 --bind 127.0.0.1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          mkdir -p .quality
          for target in "index:" "explore:explore.html" "lab:lab.html" "evidence:evidence.html"; do
            name="${target%%:*}"
            page="${target#*:}"
            npx --yes lighthouse@13.4.1 "http://127.0.0.1:8000/${page}" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path=".quality/${name}.json"
            python scripts/check_lighthouse.py ".quality/${name}.json"
          done

      - name: Persist refreshed static evidence when branch policy allows
        shell: bash
        run: |
          git config user.name "annapurna-living-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repository-signals.json data/public-history.json data/temporal-state.json assets/public-data.js
          if git diff --cached --quiet; then
            echo "No semantic/public telemetry file changes to persist."
          else
            git commit -m "chore(living-lab): refresh public signals and semantic history"
            git push || echo "::warning::Could not persist signal/history commit (for example branch protection). This deployment still uses the refreshed artifact; durable history requires an allowed write path."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed surface and HTTP truth contracts
        run: python scripts/verify_v33_deployed_site.py "${{ steps.deployment.outputs.page_url }}"
