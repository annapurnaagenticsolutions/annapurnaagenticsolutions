[package]
name = "invariantc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
wasm = []

[[bin]]
name = "json_api"
path = "fuzz_targets/json_api.rs"
test = false
doc = false
bench = false

[workspace]
