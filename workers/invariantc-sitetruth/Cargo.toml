[package]
name = "invariantc"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Offline-first cross-layer correctness-contract compiler and evaluator"
readme = "README.md"

[lib]
name = "invariantc_core"
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# Deliberately empty: normal tests do not call models, browsers, APIs, or networks.

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "invariantc"
path = "src/main.rs"
