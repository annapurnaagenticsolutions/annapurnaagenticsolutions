<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#071025" />
    <meta name="description" content="Vidya Yantra is an original mythic-science browser adventure about exploration, study, action, and ethical growth." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="/manus-storage/vidya-yantra-logo_e561d8a0.png" />
    <title>Vidya Yantra — The Living Knowledge Realm</title>
    <style>
      #yantra-boot{position:absolute;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 72% 64%,rgba(58,121,104,.28),transparent 25%),linear-gradient(132deg,#071025 0 45%,#273941 45% 61%,#d7b77d 61% 63%,#b66a35 63% 76%,#071025 76%);color:#f4dfb0;font-family:Manrope,sans-serif;transition:opacity .32s ease,visibility .32s ease}.boot-mark{position:absolute;right:12vw;top:16vh;width:min(40vw,440px);aspect-ratio:1;border:2px solid #d7b77d;border-radius:50%;box-shadow:0 0 0 30px rgba(168,215,232,.06),0 0 70px rgba(242,107,56,.18);transform:rotate(-18deg)}.boot-mark:before,.boot-mark:after{position:absolute;content:"";top:50%;left:-15%;width:130%;height:2px;background:#f26b38;transform:rotate(24deg)}.boot-mark:after{background:#3a7968;transform:rotate(-42deg)}.boot-mark i{position:absolute;inset:20%;border:2px solid #b66a35;border-radius:50%}.boot-mark i:nth-child(2){inset:39%;border-color:#3a7968}.boot-mark i:nth-child(3){inset:47%;border-color:#f26b38}.boot-copy{position:absolute;left:8vw;top:36vh;max-width:450px}.boot-copy span{color:#f26b38;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.boot-copy h1{margin:10px 0;font-family:"Cormorant Garamond",serif;font-size:clamp(46px,7vw,88px);line-height:.84}.boot-copy p{max-width:320px;color:#d7b77d;font-size:12px;line-height:1.6}.boot-route{position:absolute;right:4vw;bottom:8vh;width:62vw;height:2px;background:#f4dfb0;box-shadow:0 0 20px rgba(244,223,176,.4);transform:rotate(-24deg)}.boot-route:before,.boot-route:after{position:absolute;content:"";width:13px;height:13px;border:1px solid #f26b38;background:#071025;transform:rotate(45deg)}.boot-route:before{left:6%;top:-6px}.boot-route:after{right:8%;top:-6px}.boot-hidden{opacity:0;visibility:hidden}@media(max-width:700px){.boot-mark{right:-13vw;top:12vh;width:70vw}.boot-copy{left:7vw;top:50vh}.boot-route{width:94vw;right:-15vw}}
    </style>
  </head>
  <body>
    <div id="yantra-boot" aria-hidden="true"><div class="boot-mark"><i></i><i></i><i></i></div><div class="boot-copy"><span>Original learning adventure</span><h1>Vidya Yantra</h1><p>Observe the shelter. Align the measure. Carry the warning beyond the ridge.</p></div><div class="boot-route"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
