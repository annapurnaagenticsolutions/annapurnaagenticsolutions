name = "annapurnaagenticsolutions"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# Bindings (D1 + KV) are configured in the Cloudflare Pages dashboard, not here.
# This keeps account-specific resource IDs out of git and avoids placeholder
# deploy failures. See CF_SETUP.md for the one-time dashboard setup.
#
# Binding names expected by the Functions (functions/api/lead/*):
#   PRAMANA_LEADS  -> D1 database  (pramana-leads)
#   PRAMANA_OTP    -> KV namespace (PRAMANA_OTP)
#   RESEND_API_KEY -> secret       (set via dashboard or `npx wrangler secret put`)

[vars]
ALLOWED_ORIGIN = "https://annapurnaagenticsolutions.com"
