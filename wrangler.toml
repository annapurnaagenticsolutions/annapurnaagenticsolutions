name = "annapurnaagenticsolutions"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

[[d1_databases]]
binding = "PRAMANA_LEADS"
database_name = "pramana-leads"
database_id = "REPLACE_AFTER_D1_CREATE"   # fill in after: npx wrangler d1 create pramana-leads

[[kv_namespaces]]
binding = "PRAMANA_OTP"
id = "REPLACE_AFTER_KV_CREATE"            # fill in after: npx wrangler kv namespace create PRAMANA_OTP

[vars]
ALLOWED_ORIGIN = "https://annapurnaagenticsolutions.com"

# RESEND_API_KEY is a secret — set via Cloudflare dashboard or:
# npx wrangler secret put RESEND_API_KEY
